name: Release note attribution tests

on:
  pull_request:
    paths:
      - .github/scripts/prepare-release-notes.py
      - .github/tests/test_release_notes.py
      - .github/workflows/release-notes-test.yml
      - .github/workflows/semantic_release.yml
      - .github/requirements/release-notes.txt
      - .github/requirements/release-notes.in
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/release-notes.txt
      - run: python -m pip install pytest
      - run: python -m pytest -c /dev/null .github/tests/test_release_notes.py
