name: Release note attribution tests

on:
  pull_request:
    paths:
      - .github/scripts/prepare-release-notes.py
      - .github/tests/test_release_notes.py
      - .github/workflows/release-notes-test.yml
      - .github/workflows/semantic_release.yml
      - .github/requirements/release-notes.txt
      - .github/requirements/release-notes.in
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r .github/requirements/release-notes.txt
      - run: python -m pip install pytest
      - run: python -m pytest -c /dev/null .github/tests/test_release_notes.py
      - name: Dry-run release with local defaults and prepared attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B master
          git config user.name "Release dry-run"
          git config user.email "release-dry-run@example.com"
          before_head=$(git rev-parse HEAD)
          git tag --list > "$RUNNER_TEMP/tags-before"
          git status --porcelain > "$RUNNER_TEMP/status-before"
          test ! -d .github/.release-templates
          semantic-release --noop version --skip-build
          python .github/scripts/prepare-release-notes.py
          semantic-release --noop version --skip-build
          test "$(git rev-parse HEAD)" = "$before_head"
          git tag --list > "$RUNNER_TEMP/tags-after"
          git status --porcelain > "$RUNNER_TEMP/status-after"
          diff "$RUNNER_TEMP/tags-before" "$RUNNER_TEMP/tags-after"
          diff "$RUNNER_TEMP/status-before" "$RUNNER_TEMP/status-after"
