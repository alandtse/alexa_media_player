name: Release note attribution tests

on:
  pull_request:
    paths:
      - .github/scripts/attribute-release-notes.cjs
      - .github/tests/attribute-release-notes.test.cjs
      - .github/workflows/release-notes-test.yml
      - .github/workflows/semantic_release.yml
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test .github/tests/attribute-release-notes.test.cjs
