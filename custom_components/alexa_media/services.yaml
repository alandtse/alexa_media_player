force_logout:
  # Description of the service
  description: Force logout of Alexa Login account and deletion of .pickle. Intended for debugging use.
  # Different fields that your service accepts
  fields:
    # Key of the field
    email:
      # Description of the field
      description: List of Alexa accounts to log out. If empty, will log out from all known accounts.
      # Example value that can be passed for this field
      example: "my_email@alexa.com"

restore_volume:
  description: Restores an Alexa Media Player volume level to the previous volume level.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to restore volume on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

get_history_records:
  description: Returns the last entries of all the customer history.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to get history from.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    entries:
      name: Entries
      description: Number of records to return.
      required: false
      default: 5
      example: 5

update_last_called:
  # Description of the service
  description: Forces update of last_called echo device for each Alexa account.
  # Different fields that your service accepts
  fields:
    # Key of the field
    email:
      # Description of the field
      description: List of Alexa accounts to update. If empty, will update all known accounts.
      # Example value that can be passed for this field
      example: "my_email@alexa.com"

enable_network_discovery:
  name: Enable network discovery
  description: >
    Re-enable Alexa network discovery so the next polling cycle will
    rediscover Alexa devices for the selected accounts.
  fields:
    email:
      name: Account email(s)
      description: >
        Optional Alexa account email or list of emails. If omitted,
        all Alexa Media accounts will be refreshed.
      required: false
      example: [email protected]
      selector:
        text:

amazon_kids_enable:
  name: Enable Amazon Kids
  description: Enable Amazon Kids (child mode) on an Echo by assigning it to a child profile.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to enable Amazon Kids on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    child:
      name: Child
      description: Child profile first name (or directedId) to assign the device to.
      required: true
      example: "Anton"
      selector:
        text:

amazon_kids_disable:
  name: Disable Amazon Kids
  description: Disable Amazon Kids (child mode) on an Echo by unassigning it from any child.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to disable Amazon Kids on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

create_alarm:
  name: Create alarm
  description: Create an alarm on an Echo.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to set the alarm on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    time:
      name: Time
      description: Time the alarm rings.
      required: true
      example: "06:30:00"
      selector:
        time:
    days:
      name: Alarm days
      description: >
        Select today or tomorrow for a one-off alarm; weekdays, weekends or
        everyday for a repeating alarm; or select specific weekdays.
        Use presets alone. Leave empty for the next occurrence of the time.
      required: false
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - weekdays
            - weekends
            - everyday
            - today
            - tomorrow

    alarm_type:
      name: Alarm type (experimental)
      description: Use a previously learned Alexa music asset, matched by provider and station name.
      required: false
      default: default
      selector:
        select:
          options:
            - default
            - music
    music_provider:
      name: Music provider (used to find a learned music alarm)
      required: false
      selector:
        text:
    music_entity:
      name: Music station or content (used to find a learned music alarm)
      required: false
      selector:
        text:

list_alarms:
  name: List alarms (experimental)
  description: Returns cached alarm metadata for one Echo, including music station/provider.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

enable_alarm:
  name: Enable alarm
  description: Turn on an Echo alarm.
  fields: &alarm_fields
    entity_id:
      name: Entity
      description: Alexa Media Player device the alarm is on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    alarm_id:
      name: Alarm ID
      description: The alarm's id, from the sorted_all attribute of the device's next alarm sensor.
      required: true
      selector:
        text:

disable_alarm:
  name: Disable alarm
  description: Turn off an Echo alarm without deleting it.
  fields: *alarm_fields

delete_alarm:
  name: Delete alarm
  description: Delete an Echo alarm.
  fields: *alarm_fields
