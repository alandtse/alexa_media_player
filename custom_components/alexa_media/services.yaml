force_logout:
  # Description of the service
  description: Mark Alexa Login accounts for reauthentication. Intended for debugging use.
  # Different fields that your service accepts
  fields:
    # Key of the field
    email:
      # Description of the field
      description: List of Alexa accounts to log out. If empty, will log out from all known accounts.
      # Example value that can be passed for this field
      example: "my_email@alexa.com"

restore_volume:
  description: Restores an Alexa Media Player volume level to the previous volume level.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to restore volume on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

get_history_records:
  description: Returns the last entries of all the customer history.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to get history from.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    entries:
      name: Entries
      description: Number of records to return.
      required: false
      default: 5
      example: 5

update_last_called:
  # Description of the service
  description: Forces update of last_called echo device for each Alexa account.
  # Different fields that your service accepts
  fields:
    # Key of the field
    email:
      # Description of the field
      description: List of Alexa accounts to update. If empty, will update all known accounts.
      # Example value that can be passed for this field
      example: "my_email@alexa.com"

enable_network_discovery:
  name: Enable network discovery
  description: >
    Re-enable Alexa network discovery so the next polling cycle will
    rediscover Alexa devices for the selected accounts.
  fields:
    email:
      name: Account email(s)
      description: >
        Optional Alexa account email or list of emails. If omitted,
        all Alexa Media accounts will be refreshed.
      required: false
      example: [email protected]
      selector:
        text:

amazon_kids_enable:
  name: Enable Amazon Kids
  description: Enable Amazon Kids (child mode) on an Echo by assigning it to a child profile.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to enable Amazon Kids on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    child:
      name: Child
      description: Child profile first name (or directedId) to assign the device to.
      required: true
      example: "Anton"
      selector:
        text:

amazon_kids_disable:
  name: Disable Amazon Kids
  description: Disable Amazon Kids (child mode) on an Echo by unassigning it from any child.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to disable Amazon Kids on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

create_alarm:
  name: Create alarm
  description: Create an alarm on an Echo.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player device to set the alarm on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    time:
      name: Time
      description: Time the alarm rings.
      required: true
      example: "06:30:00"
      selector:
        time:
    days:
      name: Alarm days
      description: >
        Select today or tomorrow for a one-off alarm; weekdays, weekends or
        everyday for a repeating alarm; or select specific weekdays.
        Use presets alone. Leave empty for the next occurrence of the time.
      required: false
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
            - weekdays
            - weekends
            - everyday
            - today
            - tomorrow

    alarm_type:
      name: Alarm type (experimental)
      description: Use a music selection currently present in cached Alexa alarms, matched by provider and name. IDs are not persisted.
      required: false
      default: default
      selector:
        select:
          options:
            - default
            - music
    music_provider:
      name: Music provider (match a cached Alexa music alarm)
      required: false
      selector:
        text:
    music_entity:
      name: Music station or content (match a cached Alexa music alarm)
      required: false
      selector:
        text:

list_alarms:
  name: List alarms (experimental)
  description: Returns cached alarm metadata for one Echo, including music station/provider.
  fields:
    entity_id:
      name: Entity
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media

enable_alarm:
  name: Enable alarm
  description: Turn on an Echo alarm.
  fields: &alarm_fields
    entity_id:
      name: Entity
      description: Alexa Media Player device the alarm is on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
    alarm_id:
      name: Alarm ID
      description: The alarm's id, from the sorted_all attribute of the device's next alarm sensor.
      required: true
      selector:
        text:

disable_alarm:
  name: Disable alarm
  description: Turn off an Echo alarm without deleting it.
  fields: *alarm_fields

delete_alarm:
  name: Delete alarm
  description: Delete an Echo alarm.
  fields: *alarm_fields

skip_next_alarm:
  name: Skip next alarm
  description: >-
    Request skipping the next occurrence of an active recurring Echo alarm.
    Check the next alarm sensor after it refreshes before calling again.
  fields: *alarm_fields

repeat_last_message:
  name: Repeat Last Message
  description: >
    Sends the last TTS message or announcement sent to an Echo by the notify
    service again. Messages are kept until Home Assistant restarts or the
    integration reloads.
  fields:
    entity_id:
      name: Entity
      description: Alexa Media Player devices to repeat the last message on.
      required: true
      selector:
        entity:
          domain: media_player
          integration: alexa_media
          multiple: true

get_smart_home_groups:
  name: Get smart-home groups
  description: >
    Returns the smart-home groups (rooms) of an Alexa account and its
    smart-home devices with their endpoint and appliance IDs.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:

create_smart_home_group:
  name: Create smart-home group
  description: Creates a smart-home group (room) and returns its ID.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    name:
      name: Name
      description: Name of the new group.
      required: true
      example: Office
      selector:
        text:
    appliance_ids:
      name: Appliance IDs
      description: Appliance IDs of the devices to add to the group.
      required: false
      selector:
        text:
          multiple: true

rename_smart_home_group:
  name: Rename smart-home group
  description: Renames a smart-home group and keeps its devices.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    group_id:
      name: Group ID
      description: ID of the group, from get_smart_home_groups.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New name of the group.
      required: true
      example: Office
      selector:
        text:

set_smart_home_group_members:
  name: Set smart-home group members
  description: Replaces the devices of a smart-home group.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    group_id:
      name: Group ID
      description: ID of the group, from get_smart_home_groups.
      required: true
      selector:
        text:
    appliance_ids:
      name: Appliance IDs
      description: >
        Appliance IDs of all devices the group should contain. An empty list
        removes all devices.
      required: true
      selector:
        text:
          multiple: true

delete_smart_home_group:
  name: Delete smart-home group
  description: Deletes a smart-home group. Its devices stay in the account.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    group_id:
      name: Group ID
      description: ID of the group, from get_smart_home_groups.
      required: true
      selector:
        text:

rename_smart_home_device:
  name: Rename smart-home device
  description: >
    Renames a smart-home device in the Alexa account. Alexa does not accept
    names with an underscore.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    endpoint_id:
      name: Endpoint ID
      description: Endpoint ID of the device, from get_smart_home_groups.
      required: true
      selector:
        text:
    name:
      name: Name
      description: New name of the device.
      required: true
      example: Desk lamp
      selector:
        text:

set_smart_home_device_enabled:
  name: Enable or disable smart-home device
  description: Enables or disables a smart-home device in the Alexa account.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    endpoint_id:
      name: Endpoint ID
      description: Endpoint ID of the device, from get_smart_home_groups.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Whether the device is enabled.
      required: true
      selector:
        boolean:

forget_smart_home_device:
  name: Forget smart-home device
  description: >
    Removes a smart-home device from the Alexa account. A later device search
    can add it again.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
    endpoint_id:
      name: Endpoint ID
      description: Endpoint ID of the device, from get_smart_home_groups.
      required: true
      selector:
        text:

discover_smart_home_devices:
  name: Discover smart-home devices
  description: >
    Starts an Alexa smart-home device search, like the device search in the
    Alexa app. Echo devices with a Zigbee hub search as well, so new devices
    can be added to the account without a group.
  fields:
    email:
      name: Account email
      description: >
        Alexa account to use. Required when more than one account is set up.
      required: false
      example: "my_email@alexa.com"
      selector:
        text:
